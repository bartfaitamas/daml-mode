name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.emacs == 'snapshot' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # lsp-mode needs Emacs 29.1, so only daml-mode is tested on
          # older versions, with eglot from GNU ELPA.
          - emacs: '27.1'
            make: NEEDED_PACKAGES="haskell-mode eglot" compile-daml-mode test-daml-mode
          - emacs: '28.2'
            make: NEEDED_PACKAGES="haskell-mode eglot" compile-daml-mode test-daml-mode
          - emacs: '29.1'
            make: compile test
          - emacs: '30.2'
            make: compile test
          - emacs: '31.1'
            make: compile test
          - emacs: snapshot
            make: compile test
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      - run: make ${{ matrix.make }}

  package-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@v8.0
        with:
          version: '30.2'
      - run: make package-lint-daml-lsp
      # Warns about `with-eval-after-load', used on purpose to register
      # with eglot without depending on it.
      - run: make package-lint-daml-mode
        continue-on-error: true
